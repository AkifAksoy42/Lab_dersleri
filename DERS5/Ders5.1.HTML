<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #yeni{
        text-align: center;
        padding: 45px;
        margin:75px ;
        width: 200px; 
        height: 200px;
        background-color: aqua;
        border:solid black ;
    }
</style>

<body>
    <div style=" outline: 3px solid blue;border: 3px dashed black; width: 200px; height: 200px; color:aliceblue; background-color:green; margin: 50px; padding:50px;">MERHABA</div>
    <div style=" padding:50px; margin: 50px; height: 200px; width: 200px; border: 5px dotted black; background-color: blueviolet; color:white">MERHABA HTML</div>
<!-- 
    padding div içerisindeki yazının boşluğunu ayarlar
    margin div'in sayfanın kenarlarına olan boşluğunu ayarlar
    outline div'in dış tarafına çizgi çeker
    border div'in kenarlarına çizgi çeker
    solid--tek çizgi
    dotted--noktalı çizgi
    dashed--kesikli çizgi
    double--çift çizgi  
-->
     <div id="yeni">
        <h1>İlk CSS Çlışmam</h1>
        <p>Bu bir paragraftır</p>
    </div>
</body>
</html>
